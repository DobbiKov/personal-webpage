<!doctype html>
<!--
    Source for assets/og-card.png — the 1200×630 link-preview image.
    Mirrors the hero card at the top of index.html. Regenerate with:
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
        --screenshot=assets/og-card.png --window-size=1200,630 \
        --hide-scrollbars assets/og/og-card.html
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap"
            rel="stylesheet"
        />
        <link
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
            rel="stylesheet"
        />
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            body {
                width: 1200px;
                height: 630px;
                background: #f3f4f6;
                color: #1f2730;
                font-family: "Roboto", sans-serif;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                position: relative;
            }
            .card {
                display: flex;
                align-items: center;
                gap: 72px;
            }
            .card img {
                width: 360px;
                height: 360px;
                border-radius: 50%;
            }
            .text {
                height: 360px;
                display: flex;
                flex-direction: column;
                justify-content: space-between;
                text-align: right;
            }
            h1 {
                font-weight: 700;
                font-size: 72px;
                line-height: 1.1;
            }
            h2 {
                font-weight: 300;
                font-size: 44px;
                line-height: 1.3;
                color: #4a5a6a;
                margin-top: 16px;
            }
            .icons {
                display: flex;
                justify-content: flex-end;
                align-items: center;
                gap: 36px;
                font-size: 52px;
            }
            .icons .cv {
                font-weight: 500;
                font-size: 46px;
            }
            .domain {
                position: absolute;
                bottom: 28px;
                font-size: 24px;
                font-weight: 500;
                letter-spacing: 4px;
                color: #5f6f80;
            }
        </style>
    </head>
    <body>
        <div class="card">
            <img src="../myphoto2.jpg" alt="" />
            <div class="text">
                <div>
                    <h1>Yehor Korotenko</h1>
                    <h2>SWE<br />Polytechnique Student</h2>
                </div>
                <div class="icons">
                    <span class="cv">CV</span>
                    <i class="fab fa-github"></i>
                    <i class="fab fa-linkedin"></i>
                    <i class="fas fa-x"></i>
                    <i class="fas fa-envelope"></i>
                </div>
            </div>
        </div>
        <div class="domain">KOROTENKY.COM</div>
    </body>
</html>
