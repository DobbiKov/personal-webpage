<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="ukraine.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2a5d8f" />
    <script>
      (() => {
        const key = "dobbikov-theme";
        try {
          const savedTheme = localStorage.getItem(key);
          if (savedTheme === "dark" || savedTheme === "light") {
            document.documentElement.setAttribute("data-theme", savedTheme);
          }
        } catch (error) {
          // Ignore storage access issues.
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="apple-touch-icon" href="logo192.png" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Yehor Korotenko</title>
  </head>
  <body>
    <main class="main_cont">
      <section class="main_cont_inner">
        <section class="main_cont_about">
          <img
            src="assets/myphoto2.png"
            alt="Portrait of Yehor Korotenko"
            class="main_cont_about_inner"
          />
          <div class="main_cont_text_about_me main_cont_about_inner">
            <h1>Yehor Korotenko</h1>
            <h2>
              Developer<br />
              Math and Comp Sci Student
            </h2>
            <div class="main_cont_about_inner_icons">
              <a href="https://cv.dobbikov.com" target="_blank" rel="noopener noreferrer">
                <span class="cv_icon_text">CV</span>
              </a>
              <a
                href="https://github.com/DobbiKov"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="GitHub profile"
              >
                <i class="fab fa-github" aria-hidden="true"></i>
              </a>
              <a
                href="https://linkedin.com/in/yehor-korotenko"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="LinkedIn profile"
              >
                <i class="fab fa-linkedin" aria-hidden="true"></i>
              </a>
              <a href="mailto:yehor.korotenko@outlook.com" aria-label="Send an email">
                <i class="fas fa-envelope" aria-hidden="true"></i>
              </a>
              <a
                href="https://instagram.com/dobbikov"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Instagram profile"
              >
                <i class="fab fa-instagram" aria-hidden="true"></i>
              </a>
            </div>
          </div>
        </section>

        <nav class="main_cont_routs" aria-label="Primary">
          <button
            class="nav-toggle"
            type="button"
            data-nav-toggle
            aria-expanded="false"
            aria-controls="primary-nav-menu"
            aria-label="Open navigation menu"
          >
            <i class="fas fa-bars" aria-hidden="true"></i>
          </button>
          <a
            href="index.html"
            class="main_header_a main_brand main_cont_routs_active"
            aria-current="page"
          >
            DOBBIKOV
          </a>
          <button
            class="theme-toggle"
            type="button"
            data-theme-toggle
            aria-label="Switch to dark theme"
            aria-pressed="false"
          >
            <i class="fas fa-moon" aria-hidden="true" data-theme-icon></i>
            <span class="sr-only" data-theme-toggle-label>Switch to dark theme</span>
          </button>
          <div class="main_nav_links" id="primary-nav-menu" data-nav-menu>
            <a href="about_me.html" class="main_header_a">ABOUT ME</a>
            <a href="lecture_notes.html" class="main_header_a">LECTURE NOTES</a>
            <a href="contact_me.html" class="main_header_a">CONTACT ME</a>
          </div>
        </nav>
      </section>
    </main>
    <script src="theme.js"></script>
  </body>
</html>
