summary:
  title: Summary
  paragraphs:
    - >
      I am a curious young man with over six years of
      experience across research, freelance and
      industry. Currently I am studying at
      <strong>École Polytechnique de Paris</strong>
      (X26) on Masters of Engineering (ingénieur polytechnicien).
    - >
      Currently working at French <strong>Departmental Fire and Rescue Service (SDIS 77)</strong>
      where I build and train <em>machine learning</em>
      models and develop digital services. I am experienced in
      full-stack development, open-source
      contribution, machine learning and math research, recently
      published at JDSE 2025 and Ukrainian Mathematics Day.

