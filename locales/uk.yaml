about:
  title: Про мене

summary:
  title: Коротко
  paragraphs:
    - >
      Я допитливий молодий чоловік із понад шестирічним досвідом у
      дослідженнях, фрилансі та індустрії. Зараз навчаюся в
      <strong>École Polytechnique de Paris</strong> (X26) за інженерною
      програмою рівня магістра (ingénieur polytechnicien).
    - >
      Нині працюю у французькій <strong>Департаментській службі пожежної
      охорони та порятунку (SDIS 77)</strong>, де створюю й навчаю моделі
      <em>машинного навчання</em> та розробляю цифрові сервіси. Маю досвід
      full-stack розробки, участі в open-source проєктах, машинного навчання
      та математичних досліджень; нещодавно представляв роботи на JDSE 2025 та
      Ukrainian Mathematics Day.

education:
  title: Освіта
  polytechnique:
    school: École Polytechnique de Paris
    degree: Магістр інженерії — ingénieur polytechnicien
    dates: серп. 2026 – серп. 2030
  saclay:
    school: Université Paris-Saclay
    degree: Бакалавр — подвійний диплом з математики та інформатики
    dates: вер. 2023 – трав. 2026
    details:
      - >
        <strong>Середній бал:</strong> 18,04 / 20
        &mdash; 3-й із 57 студентів &mdash;
        стипендія FMJH
      - >
        <strong>Профільні курси:</strong>
        диференціальне та інтегральне числення, математичний аналіз, лінійна
        алгебра, абстрактна алгебра й теорія груп, теорія ймовірностей і
        статистика, алгоритми та структури даних, функціональне програмування,
        топологія, графічне програмування

