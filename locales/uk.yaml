experience:
  title: Досвід
  sdis:
    org: Департаментська служба пожежної охорони та порятунку (SDIS 77)
    firefighter:
      role: Пожежник-доброволець
      dates: вер. 2026 – дотепер
      desc: >
        Близько половини свого часу присвячую службі пожежником-добровольцем:
        виїжджаю на екстрені виклики та допомагаю в рятувальних і аварійних
        операціях.
    rd:
      role: Інженер з досліджень і розробок
      dates: вер. 2026 – дотепер
      desc: >
        Проєктую та розробляю моделі машинного навчання й цифрові інструменти,
        що відповідають потребам адміністрації служби та оптимізують її робочі
        процеси.
  lisn_2026:
    org: LISN
    role: Стажер — інженер-дослідник
    dates: черв. 2026 – лип. 2026
    desc: >
      Використання адаптивного машинного перекладу для підтримки спільного
      написання та супроводу великих багатомовних наукових документів.
  tutor:
    org: Самозайнятий
    role: Репетитор з математики
    dates: бер. 2026 – дотепер
    desc: >
      Індивідуальні заняття з математики для студентів першого курсу
      бакалаврату та школярів. Зосереджуюся на зміцненні базового розуміння,
      навичках розв’язування задач і підготовці до іспитів.
  centralesupelec:
    org: CentraleSupélec
    role: Незалежний інженер-програміст
    dates: вер. 2025 – серп. 2026
    desc: >
      Використання адаптивного машинного перекладу для підтримки спільного
      написання та супроводу великих багатомовних обчислювальних наукових
      наративів (продовження проєкту, розпочатого в LISN). За контрактом з
      листопада 2025.
  lisn_2025:
    org: LISN
    role: Стажер-дослідник
    dates: трав. 2025 – лип. 2025
    desc: >
      Використання адаптивного машинного перекладу для підтримки спільного
      написання та супроводу великих багатомовних обчислювальних наукових
      наративів.
  devdjsua:
    org: DevDJsUa
    role: Інженер-програміст
    dates: черв. 2021 – груд. 2021
    desc: >
      Створював масштабовані full-stack застосунки та інтерактивні інструменти
      для клієнтів, спеціалізуючись на індивідуальних рішеннях, зокрема
      CRM-системах і ботах для користувачів.
  freelance:
    org: Фриланс
    role: Інженер-програміст
    dates: січ. 2021 – лют. 2022
    desc: >
      Розробляв full-stack вебзастосунки на JavaScript, C#, React та Angular.
      Спроєктував і реалізував кілька Telegram-ботів для автоматизації та
      взаємодії з користувачами.

