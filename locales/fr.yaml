projects:
  title: Projets
  on_github: sur GitHub
  view_on_github: Voir sur GitHub
  lesia: >
    <strong>lesia</strong> - une chaîne d'outils issue de la recherche pour
    maintenir des documents multilingues en préservant le style et la syntaxe.
  loggit: >
    <strong>LogGit</strong> - une bibliothèque de journalisation pour Rust,
    légère et simple d'utilisation.
  open_digraph: >
    <strong>Open DiGraph Lib</strong> - une bibliothèque de manipulation de
    graphes et de circuits booléens.
  music_sorting: >
    <strong>Algorithme de tri musical</strong> - un algorithme en Rust qui
    analyse la tonalité des morceaux et les ordonne de façon mélodique.
  gta: >
    <strong>Mode de jeu GTA Online&nbsp;:</strong> développement d'un mode de
    jeu de plus de 30&nbsp;000 lignes en Pawn, intégrant des fonctionnalités de
    CRM, du SQL et des algorithmes.

