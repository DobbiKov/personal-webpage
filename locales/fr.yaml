summary:
  title: En bref
  paragraphs:
    - >
      Jeune homme curieux, j'ai plus de six ans d'expérience entre recherche,
      freelance et industrie. J'étudie actuellement à
      l'<strong>École Polytechnique de Paris</strong> (X26), dans le cycle
      ingénieur polytechnicien.
    - >
      Je travaille actuellement au <strong>Service départemental d'incendie et
      de secours de Seine-et-Marne (SDIS 77)</strong>, où je conçois et entraîne
      des modèles d'<em>apprentissage automatique</em> et développe des services
      numériques. J'ai de l'expérience en développement full-stack, en
      contribution open source, en apprentissage automatique et en recherche
      mathématique, avec des travaux récemment présentés aux JDSE 2025 et au
      Ukrainian Mathematics Day.

