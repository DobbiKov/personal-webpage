<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" type="image/png" href="ukraine.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2a5d8f" />
    <script>
      (() => {
        const key = "dobbikov-theme";
        try {
          const savedTheme = localStorage.getItem(key);
          if (savedTheme === "dark" || savedTheme === "light") {
            document.documentElement.setAttribute("data-theme", savedTheme);
          }
        } catch (error) {
          // Ignore storage access issues.
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="apple-touch-icon" href="logo192.png" />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <title>Contact Me | Yehor Korotenko</title>
  </head>
  <body>
    <div class="lect_notes_main_cont">
      <header class="header_main_cont">
        <div class="header_main_cont_inner">
          <nav class="main_cont_routs" aria-label="Primary">
            <button
              class="nav-toggle"
              type="button"
              data-nav-toggle
              aria-expanded="false"
              aria-controls="primary-nav-menu"
              aria-label="Open navigation menu"
            >
              <i class="fas fa-bars" aria-hidden="true"></i>
            </button>
            <a href="index.html" class="main_header_a main_brand">DOBBIKOV</a>
            <button
              class="theme-toggle"
              type="button"
              data-theme-toggle
              aria-label="Switch to dark theme"
              aria-pressed="false"
            >
              <i class="fas fa-moon" aria-hidden="true" data-theme-icon></i>
              <span class="sr-only" data-theme-toggle-label>Switch to dark theme</span>
            </button>
            <div class="main_nav_links" id="primary-nav-menu" data-nav-menu>
              <a href="about_me.html" class="main_header_a">ABOUT ME</a>
              <a href="lecture_notes.html" class="main_header_a">LECTURE NOTES</a>
              <a href="contact_me.html" class="main_header_a main_cont_routs_active" aria-current="page"
                >CONTACT ME</a
              >
            </div>
          </nav>
        </div>
      </header>
      <main class="lect_notes_main_cont_inner contactme-page">
        <h1 class="lect_notes_page-title">Contact Me</h1>
        <h2 class="lect_notes_page-sub_title">Yehor Korotenko</h2>

        <div class="contactme-sections">
          <section class="section contactme-section">
            <h2 class="section-title contactme-section-title">Direct Channels</h2>
            <p class="contact-description">
              Feel free to reach out to me through any of the following channels.
            </p>

            <div class="contact-details">
              <div class="contact-item">
                <i class="fas fa-envelope" aria-hidden="true"></i>
                <div class="contact-item-content">
                  <p class="contact-label">Email</p>
                  <a href="mailto:yehor.korotenko@outlook.com">yehor.korotenko@outlook.com</a>
                </div>
              </div>
              <div class="contact-item">
                <i class="fas fa-envelope" aria-hidden="true"></i>
                <div class="contact-item-content">
                  <p class="contact-label">University Email</p>
                  <a href="mailto:yehor.korotenko@universite-paris-saclay.fr"
                    >yehor.korotenko@universite-paris-saclay.fr</a
                  >
                </div>
              </div>
              <div class="contact-item">
                <i class="fas fa-paper-plane" aria-hidden="true"></i>
                <div class="contact-item-content">
                  <p class="contact-label">Telegram</p>
                  <a href="https://t.me/dobbikov">dobbikov</a>
                </div>
              </div>
            </div>
          </section>

          <section class="section contactme-section">
            <h2 class="section-title contactme-section-title">Social Profiles</h2>
            <div class="icons">
              <a
                href="https://github.com/DobbiKov"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="GitHub profile"
              >
                <i class="fab fa-github" aria-hidden="true"></i>
              </a>
              <a
                href="https://linkedin.com/in/yehor-korotenko"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="LinkedIn profile"
              >
                <i class="fab fa-linkedin" aria-hidden="true"></i>
              </a>
              <a href="mailto:yehor.korotenko@outlook.com" aria-label="Send an email">
                <i class="fas fa-envelope" aria-hidden="true"></i>
              </a>
              <a
                href="https://instagram.com/dobbikov"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Instagram profile"
              >
                <i class="fab fa-instagram" aria-hidden="true"></i>
              </a>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script src="theme.js"></script>
  </body>
</html>
